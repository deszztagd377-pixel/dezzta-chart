title = "DEZZTA CHART secret audit"

[extend]
useDefault = true

# This exact token-shaped value is synthetic test data used only to verify
# that the frontend scanner catches GitHub-token patterns. Scope the exception
# to that exact value in that exact test file; do not suppress other findings.
[[allowlists]]
description = "Exact synthetic GitHub-token fixture in scanner regression test"
condition = "AND"
regexTarget = "match"
regexes = ['''ghp_123456789012345678901234''']
paths = ['''scripts/check-frontend-bundle-secrets\.node-test\.mjs$''']

# Exact Git commit SHA in project-status metadata; this is a public identifier,
# not a credential. Scope the exception to this one value and one documentation file.
[[allowlists]]
description = "Exact public commit SHA false positive in project status metadata"
condition = "AND"
regexTarget = "line"
regexes = ['''^Latest observed exact-head CI/CodeQL/secret-audit checkpoint: b37c69d6aaee2f764c3357834e868a3e53bddbe1 \(CI #1141, CodeQL #499, secret audit #80 passed\)
'']
paths = ['''PROJECT_STATUS\.md
'']
