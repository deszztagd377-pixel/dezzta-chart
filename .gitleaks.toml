title = "DEZZTA CHART secret audit"

[extend]
useDefault = true

# Exact synthetic token fixture used only by the frontend scanner regression test.
[[allowlists]]
description = "Exact synthetic GitHub-token fixture in scanner regression test"
condition = "AND"
regexTarget = "match"
regexes = ['''ghp_123456789012345678901234''']
paths = ['''scripts/check-frontend-bundle-secrets[.]node-test[.]mjs$''']

# Exact public commit-metadata line falsely matches the generic-api-key detector.
[[allowlists]]
description = "Exact public commit metadata line false positive"
condition = "AND"
regexTarget = "line"
regexes = ['''^Latest observed exact-head CI/CodeQL/secret-audit checkpoint: b37c69d6aaee2f764c3357834e868a3e53bddbe1 .*$''']
paths = ['''PROJECT_STATUS[.]md$''']

# Historical progress-ledger commit metadata triggered generic-api-key.
# Exempt only that exact commit and only that documentation path.
[[allowlists]]
description = "One historical public commit metadata false positive"
condition = "AND"
commits = ['''34cf606f4f3fdda4bd41c71b7ca29818487eb60b''']
paths = ['''docs/PROJECT_PROGRESS_INDICATOR[.]md$''']
