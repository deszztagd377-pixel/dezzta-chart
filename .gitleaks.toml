title = "DEZZTA CHART secret audit"

[extend]
useDefault = true

# Exact synthetic token fixture used only by the frontend scanner regression test.
[[allowlists]]
description = "Exact synthetic GitHub-token fixture in scanner regression test"
condition = "AND"
regexTarget = "match"
regexes = ['''ghp_123456789012345678901234''']
paths = ['''scripts/check-frontend-bundle-secrets[.]node-test[.]mjs$''']

# Exact public commit-metadata line falsely matches the generic-api-key detector.
[[allowlists]]
description = "Exact public commit metadata line false positive"
condition = "AND"
regexTarget = "line"
regexes = ['''^Latest observed exact-head CI/CodeQL/secret-audit checkpoint: b37c69d6aaee2f764c3357834e868a3e53bddbe1 .*$''']
paths = ['''PROJECT_STATUS[.]md$''']

# Historical progress-ledger commit metadata triggered generic-api-key.
# Exempt only that exact commit and only that documentation path.
[[allowlists]]
description = "One historical public commit metadata false positive"
condition = "AND"
commits = ['''34cf606f4f3fdda4bd41c71b7ca29818487eb60b''']
paths = ['''docs/PROJECT_PROGRESS_INDICATOR[.]md$''']

# Two exact documentation sentences were misclassified by generic-api-key because
# they describe Firebase signed-token/session acceptance. Keep exceptions limited
# to the historical commit, exact path and exact line; do not suppress the rule.
[[allowlists]]
description = "Exact Gate 20 dashboard wording false positive"
condition = "AND"
regexTarget = "line"
regexes = ['''^\*\*Gate 20 repository evidence:\*\* WebSocket ticket renewal now has explicit cross-account rejection coverage; real Firebase project signed-token, expiry/revocation and browser/Android reconnect acceptance remain open\.$''']
commits = ['''67fd1204cedfd9f75fe4472c5a2a86e200893686''']
paths = ['''docs/PROJECT_PROGRESS_INDICATOR_CURRENT[.]md$''']

[[allowlists]]
description = "Exact Gate 20 work-cycle wording false positive"
condition = "AND"
regexTarget = "line"
regexes = ['''^- Gate 20 remains \*\*OPEN\*\* pending real Firebase signed-token, expiry/revocation and client reconnect acceptance\.$''']
commits = ['''2c2dfb4d9c8db752221b6f6f3ea12bda05ae9265''']
paths = ['''docs/WORK_CYCLE_2026-11-20_BATCH62J47_CROSS_ACCOUNT_WEBSOCKET_RENEWAL[.]md$''']
