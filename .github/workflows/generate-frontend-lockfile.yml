name: Generate frontend dependency lockfile

on:
  push:
    branches:
      - 'phase-2/market-data-foundation'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  resolve:
    name: Resolve npm lockfile on GitHub runner
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20
      - name: Resolve package-lock.json with npm
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Validate generated lockfile
        run: npm ls --package-lock-only --depth=0
      - name: Commit generated lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "package-lock.json is unchanged"
          else
            git commit -m "build(deps): add npm-generated frontend lockfile"
            git push
          fi
      - name: Upload generated lockfile
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: dezzta-frontend-package-lock
          path: package-lock.json
          if-no-files-found: error
          retention-days: 1
