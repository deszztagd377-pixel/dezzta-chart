name: DEZZTA CHART - Full Git History Secret Audit

on:
  push:
    branches:
      - 'phase-2/market-data-foundation'
  workflow_dispatch:
  schedule:
    - cron: '17 4 * * 1'

permissions:
  contents: read

concurrency:
  group: secret-history-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: Scan complete reachable Git history
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout complete repository history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.1.0
        with:
          fetch-depth: 0

      - name: Download and verify pinned Gitleaks CLI
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/gitleaks_8.30.1_linux_x64.tar.gz"
          curl --fail --silent --show-error --location \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            --output "$archive"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $archive" | sha256sum --check
          tar -xzf "$archive" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" version

      - name: Scan all reachable Git refs and commit history
        env:
          GITLEAKS_CONFIG: .gitleaks.toml
        run: |
          set +e
          "$RUNNER_TEMP/gitleaks" git --redact=100 --no-banner --report-format json --report-path "$RUNNER_TEMP/gitleaks-report.json" --log-opts="--all" .
          scan_status=$?
          set -e
          python3 - <<'PY'
          import json
          from pathlib import Path

          report = Path("$RUNNER_TEMP/gitleaks-report.json")
          if not report.exists():
              print("GITLEAKS_REPORT: no findings report generated")
          else:
              findings = json.loads(report.read_text())
              print(f"GITLEAKS_REDACTED_FINDINGS: {len(findings)}")
              for finding in findings:
                  print(
                      "REDACTED_LOCATION:",
                      finding.get("RuleID", "unknown-rule"),
                      f"{finding.get('File', 'unknown-file')}:{finding.get('StartLine', '?')}",
                      f"commit={finding.get('Commit', 'unknown')}",
                      f"fingerprint={finding.get('Fingerprint', 'unknown')}",
                  )
          PY
          exit "$scan_status"
