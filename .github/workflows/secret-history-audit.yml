name: DEZZTA CHART - Full Git History Secret Audit

on:
  push:
    branches:
      - 'phase-2/market-data-foundation'
  workflow_dispatch:
  schedule:
    - cron: '17 4 * * 1'

permissions:
  contents: read

concurrency:
  group: secret-history-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: Scan complete reachable Git history
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout complete repository history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.1.0
        with:
          fetch-depth: 0

      - name: Download and verify pinned Gitleaks CLI
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/gitleaks_8.30.1_linux_x64.tar.gz"
          curl --fail --silent --show-error --location \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            --output "$archive"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $archive" | sha256sum --check
          tar -xzf "$archive" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" version

      - name: Scan all reachable Git refs and commit history
        env:
          GITLEAKS_CONFIG: .gitleaks.toml
        run: |
          "$RUNNER_TEMP/gitleaks" git --redact --no-banner --log-opts="--all" .
