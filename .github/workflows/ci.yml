name: DEZZTA CHART - Automated Tests

on:
  push:
    branches:
      - main
      - 'phase-2/market-data-foundation'
  pull_request:
    branches:
      - main
  workflow_dispatch:

# Keep only the newest CI run for each branch or pull-request ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Test and Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20

      - name: Install frontend dependencies
        run: npm ci

      - name: Audit frontend dependencies
        run: npm audit --audit-level=high

      - name: Run frontend unit tests
        run: npm test

      - name: Build frontend
        run: npm run build

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements-dev.txt

      - name: Run backend tests
        working-directory: backend
        run: python -m pytest -vv -ra --durations=20 --timeout=120 --timeout-method=signal -o faulthandler_timeout=120

      - name: Audit backend dependencies
        run: |
          python -m pip install pip-audit
          pip-audit -r backend/requirements-dev.txt

      - name: Build backend container image
        run: docker build -f backend/Dockerfile -t dezzta-chart-backend:ci backend

      - name: Scan backend container image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: dezzta-chart-backend:ci
          format: table
          vuln-type: os,library
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: '1'
          version: v0.76.2
          timeout: 10m0s

      - name: Export current image vulnerability report
        if: always()
        continue-on-error: true
        run: |
          if command -v trivy >/dev/null 2>&1 && docker image inspect dezzta-chart-backend:ci >/dev/null 2>&1; then
            trivy image --format json --output trivy-current.json --severity HIGH,CRITICAL --pkg-types os,library dezzta-chart-backend:ci
          else
            echo "Current image or Trivy binary unavailable; JSON report not produced."
          fi

      - name: Build Debian Bookworm comparison image
        if: always() && github.ref == 'refs/heads/phase-2/market-data-foundation'
        continue-on-error: true
        run: |
          awk '
            BEGIN { replaced = 0 }
            /^FROM python:3\.12-slim$/ {
              print "FROM python:3.12-slim-bookworm"
              replaced++
              next
            }
            { print }
            END { if (replaced != 1) exit 42 }
          ' backend/Dockerfile > "$RUNNER_TEMP/Dockerfile.bookworm"
          docker build -f "$RUNNER_TEMP/Dockerfile.bookworm" -t dezzta-chart-backend:bookworm-comparison backend

      - name: Export Debian Bookworm comparison report
        if: always() && github.ref == 'refs/heads/phase-2/market-data-foundation'
        continue-on-error: true
        run: |
          if command -v trivy >/dev/null 2>&1 && docker image inspect dezzta-chart-backend:bookworm-comparison >/dev/null 2>&1; then
            trivy image --format json --output trivy-bookworm.json --severity HIGH,CRITICAL --pkg-types os,library dezzta-chart-backend:bookworm-comparison
          else
            echo "Comparison image or Trivy binary unavailable; comparison report not produced."
          fi

      - name: Build Debian Trixie security-updated comparison image
        if: always() && github.ref == 'refs/heads/phase-2/market-data-foundation'
        continue-on-error: true
        run: |
          awk '
            BEGIN { injected = 0 }
            /^FROM python:3\.12-slim$/ {
              print
              print "RUN apt-get update && apt-get upgrade -y --no-install-recommends && rm -rf /var/lib/apt/lists/*"
              injected++
              next
            }
            { print }
            END { if (injected != 1) exit 42 }
          ' backend/Dockerfile > "$RUNNER_TEMP/Dockerfile.trixie-updated"
          docker build -f "$RUNNER_TEMP/Dockerfile.trixie-updated" -t dezzta-chart-backend:trixie-updated backend

      - name: Smoke-test Debian Trixie security-updated image
        if: always() && github.ref == 'refs/heads/phase-2/market-data-foundation'
        continue-on-error: true
        run: |
          if ! docker image inspect dezzta-chart-backend:trixie-updated >/dev/null 2>&1; then
            echo "Security-updated comparison image unavailable; runtime smoke test not run."
            exit 0
          fi
          docker run -d --name dezzta-chart-trixie-smoke \
            -p 127.0.0.1:18000:8000 \
            -e APP_ENV=production \
            -e CORS_ALLOWED_ORIGINS=https://dezzta-chart.vercel.app \
            -e INSTRUMENT_REGISTRY_DB_PATH=/tmp/dezzta-chart-smoke.sqlite3 \
            dezzta-chart-backend:trixie-updated
          cleanup() { docker logs dezzta-chart-trixie-smoke || true; docker rm -f dezzta-chart-trixie-smoke || true; }
          trap cleanup EXIT
          for attempt in $(seq 1 20); do
            if curl --fail --silent http://127.0.0.1:18000/health; then
              echo "Runtime health smoke test passed."
              exit 0
            fi
            sleep 1
          done
          echo "Runtime health smoke test failed."
          exit 1

      - name: Export Debian Trixie security-updated vulnerability report
        if: always() && github.ref == 'refs/heads/phase-2/market-data-foundation'
        continue-on-error: true
        run: |
          if command -v trivy >/dev/null 2>&1 && docker image inspect dezzta-chart-backend:trixie-updated >/dev/null 2>&1; then
            trivy image --format json --output trivy-trixie-updated.json --severity HIGH,CRITICAL --pkg-types os,library dezzta-chart-backend:trixie-updated
          else
            echo "Security-updated comparison image or Trivy binary unavailable; report not produced."
          fi

      - name: Build Alpine comparison image
        if: always() && github.ref == 'refs/heads/phase-2/market-data-foundation'
        continue-on-error: true
        run: |
          awk '
            BEGIN { replaced = 0; user_replaced = 0 }
            /^FROM python:3\\.12-slim$/ {
              print "FROM python:3.12-alpine"
              replaced++
              next
            }
            /^RUN useradd --system --uid 10001 --create-home appuser \\$/ {
              print "RUN addgroup -g 10001 appuser && adduser -D -H -u 10001 -G appuser appuser \\"
              if (getline <= 0) exit 43
              print
              user_replaced++
              next
            }
            { print }
            END { if (replaced != 1 || user_replaced != 1) exit 42 }
          ' backend/Dockerfile > "$RUNNER_TEMP/Dockerfile.alpine"
          docker build -f "$RUNNER_TEMP/Dockerfile.alpine" -t dezzta-chart-backend:alpine-comparison backend

      - name: Smoke-test Alpine comparison image
        if: always() && github.ref == 'refs/heads/phase-2/market-data-foundation'
        continue-on-error: true
        run: |
          if ! docker image inspect dezzta-chart-backend:alpine-comparison >/dev/null 2>&1; then
            echo "Alpine comparison image unavailable; runtime smoke test not run."
            exit 0
          fi
          cleanup() { docker logs dezzta-chart-alpine-smoke || true; docker rm -f dezzta-chart-alpine-smoke || true; }
          trap cleanup EXIT
          docker run -d --name dezzta-chart-alpine-smoke \
            -p 127.0.0.1:18001:8000 \
            -e APP_ENV=production \
            -e CORS_ALLOWED_ORIGINS=https://dezzta-chart.vercel.app \
            -e INSTRUMENT_REGISTRY_DB_PATH=/tmp/dezzta-chart-alpine-smoke.sqlite3 \
            dezzta-chart-backend:alpine-comparison
          for attempt in $(seq 1 20); do
            if curl --fail --silent http://127.0.0.1:18001/health; then
              echo "Alpine runtime health smoke test passed."
              exit 0
            fi
            sleep 1
          done
          echo "Alpine runtime health smoke test failed."
          exit 1

      - name: Export Alpine vulnerability report
        if: always() && github.ref == 'refs/heads/phase-2/market-data-foundation'
        continue-on-error: true
        run: |
          if command -v trivy >/dev/null 2>&1 && docker image inspect dezzta-chart-backend:alpine-comparison >/dev/null 2>&1; then
            trivy image --format json --output trivy-alpine.json --severity HIGH,CRITICAL --pkg-types os,library dezzta-chart-backend:alpine-comparison
          else
            echo "Alpine comparison image or Trivy binary unavailable; report not produced."
          fi

      - name: Summarize container vulnerability comparison
        if: always() && github.ref == 'refs/heads/phase-2/market-data-foundation'
        continue-on-error: true
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          def load(path):
              if not Path(path).is_file():
                  return None
              return json.loads(Path(path).read_text())

          def findings(report):
              if report is None:
                  return None
              result = {}
              for target in report.get("Results") or []:
                  for item in target.get("Vulnerabilities") or []:
                      key = (item.get("VulnerabilityID"), item.get("PkgName"), item.get("InstalledVersion"))
                      result[key] = {
                          "severity": item.get("Severity", "UNKNOWN"),
                          "fixed": item.get("FixedVersion") or "",
                          "target": target.get("Target", ""),
                      }
              return result

          # Missing reports must remain distinguishable from a completed clean scan.
          assert findings(None) is None
          assert findings({"Results": []}) == {}

          current = findings(load("trivy-current.json"))
          bookworm = findings(load("trivy-bookworm.json"))
          trixie_updated = findings(load("trivy-trixie-updated.json"))
          alpine = findings(load("trivy-alpine.json"))
          lines = [
              "# Backend container vulnerability comparison",
              "",
              "| Image | HIGH/CRITICAL findings | HIGH | CRITICAL |",
              "|---|---:|---:|---:|",
          ]
          for name, data in (
              ("Current python:3.12-slim", current),
              ("Comparison python:3.12-slim-bookworm", bookworm),
              ("Comparison Trixie + apt-get upgrade", trixie_updated),
              ("Comparison python:3.12-alpine", alpine),
          ):
              if data is None:
                  lines.append(f"| {name} | NOT AVAILABLE | NOT AVAILABLE | NOT AVAILABLE |")
                  continue
              high = sum(v["severity"] == "HIGH" for v in data.values())
              critical = sum(v["severity"] == "CRITICAL" for v in data.values())
              lines.append(f"| {name} | {len(data)} | {high} | {critical} |")
          lines += [
              "",
              "Counts are unique vulnerability/package/installed-version tuples, not Trivy's raw occurrence total.",
              "A missing report means the corresponding diagnostic build or scan did not complete.",
              "This comparison is diagnostic only; it does not change the strict required scan policy.",
              "",
          ]
          Path("container-vulnerability-comparison.md").write_text("\n".join(lines))
          print("\n".join(lines))
          PY

      - name: Upload container vulnerability reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: container-vulnerability-reports
          path: |
            trivy-current.json
            trivy-bookworm.json
            trivy-trixie-updated.json
            trivy-alpine.json
            container-vulnerability-comparison.md
          if-no-files-found: warn
          retention-days: 14
