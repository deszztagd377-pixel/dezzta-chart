name: DEZZTA CHART - Automated Tests

on:
  push:
    branches:
      - main
      - 'phase-2/market-data-foundation'
  pull_request:
    branches:
      - main
  workflow_dispatch:

# Keep only the newest CI run for each branch or pull-request ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Test and Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20

      - name: Install frontend dependencies
        run: npm ci

      - name: Audit frontend dependencies
        run: npm audit --audit-level=high

      - name: Run frontend unit tests
        run: npm test

      - name: Build frontend
        run: npm run build

      - name: Test frontend bundle secret scanner
        run: node --test scripts/check-frontend-bundle-secrets.test.mjs

      - name: Scan production frontend bundle for server credentials
        run: node scripts/check-frontend-bundle-secrets.mjs dist

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements-dev.txt

      - name: Run backend tests
        working-directory: backend
        run: python -m pytest -vv -ra --durations=20 --timeout=120 --timeout-method=signal -o faulthandler_timeout=120

      - name: Audit backend dependencies
        run: |
          python -m pip install pip-audit
          pip-audit -r backend/requirements-dev.txt

      - name: Build backend container image
        run: docker build -f backend/Dockerfile -t dezzta-chart-backend:ci backend

      - name: Scan backend container image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: dezzta-chart-backend:ci
          format: table
          vuln-type: os,library
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: '1'
          version: v0.76.2
          timeout: 10m0s

      - name: Export current image vulnerability report
        if: always()
        continue-on-error: true
        run: |
          if command -v trivy >/dev/null 2>&1 && docker image inspect dezzta-chart-backend:ci >/dev/null 2>&1; then
            trivy image --format json --output trivy-current.json --severity HIGH,CRITICAL --pkg-types os,library dezzta-chart-backend:ci
          else
            echo "Current image or Trivy binary unavailable; JSON report not produced."
          fi

      - name: Upload container vulnerability reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: container-vulnerability-reports
          path: trivy-current.json
          if-no-files-found: warn
          retention-days: 14
