name: DEZZTA CHART - Automated Tests

on:
  push:
    branches:
      - main
      - 'phase-2/market-data-foundation'
  pull_request:
    branches:
      - main
  workflow_dispatch:

# Keep only the newest CI run for each branch or pull-request ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Test and Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20

      - name: Install frontend dependencies
        run: npm ci

      - name: Audit frontend dependencies
        run: npm audit --audit-level=high

      - name: Run frontend unit tests
        run: npm test

      - name: Build frontend
        run: npm run build

      - name: Test frontend bundle secret scanner
        run: node --test scripts/check-frontend-bundle-secrets.node-test.mjs

      - name: Scan production frontend bundle for server credentials
        run: node scripts/check-frontend-bundle-secrets.mjs dist

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements-dev.txt

      - name: Run backend tests
        working-directory: backend
        env:
          REDIS_TEST_URL: redis://localhost:6379/0
        run: python -m pytest -vv -ra --durations=20 --timeout=120 --timeout-method=signal -o faulthandler_timeout=120

      - name: Audit backend dependencies
        run: |
          python -m pip install pip-audit
          pip-audit -r backend/requirements-dev.txt

      - name: Build backend container image
        run: docker build -f backend/Dockerfile -t dezzta-chart-backend:ci backend

      - name: Smoke test backend container with shared Redis guard and persistent volume
        env:
          REDIS_TEST_URL: redis://127.0.0.1:6379/15
        run: |
          set -euo pipefail
          container_name=dezzta-chart-backend-smoke
          redis_container_name=dezzta-chart-smoke-redis
          network_name=dezzta-chart-smoke-network
          volume_name=dezzta-chart-backend-smoke-data
          base_url=http://127.0.0.1:18000
          cleanup() {
            docker rm -f "$container_name" "$redis_container_name" >/dev/null 2>&1 || true
            docker volume rm -f "$volume_name" >/dev/null 2>&1 || true
            docker network rm "$network_name" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          docker network create "$network_name" >/dev/null
          docker volume create "$volume_name" >/dev/null
          docker run --detach --name "$redis_container_name" --network "$network_name" redis:7-alpine >/dev/null
          wait_for_redis() {
            for attempt in $(seq 1 20); do
              if docker exec "$redis_container_name" redis-cli ping 2>/dev/null | grep -Fxq PONG; then
                echo "Isolated smoke-test Redis is ready."
                return 0
              fi
              sleep 1
            done
            echo "Smoke-test Redis did not become ready."
            docker logs --tail 100 "$redis_container_name" || true
            return 1
          }
          start_container() {
            docker run --detach --name "$container_name" \
              --network "$network_name" \
              --publish 127.0.0.1:18000:18000 \
              --mount "type=volume,src=$volume_name,dst=/data" \
              -e APP_ENV=development \
              -e PORT=18000 \
              -e REDIS_URL="redis://$redis_container_name:6379/15" \
              -e HTTP_RATE_LIMIT_PER_CLIENT=1 \
              -e HTTP_RATE_LIMIT_GLOBAL=10 \
              -e INSTRUMENT_REGISTRY_DB_PATH=/data/dezzta-chart-smoke.sqlite3 \
              -e CORS_ALLOWED_ORIGINS=http://localhost:5173 \
              dezzta-chart-backend:ci
          }
          wait_for_health() {
            ready=0
            echo "Waiting for backend health through published loopback port 18000."
            for attempt in $(seq 1 30); do
              container_state="$(docker inspect --format '{{.State.Status}}' "$container_name" 2>/dev/null || true)"
              if [ -z "$container_state" ]; then
                echo "Backend container disappeared before becoming healthy."
                docker ps -a --no-trunc || true
                docker logs --tail 200 "$container_name" 2>&1 || true
                return 1
              fi
              if [ "$container_state" != "running" ]; then
                echo "Backend container exited before becoming healthy (state=$container_state)."
                docker inspect --format 'exit_code={{.State.ExitCode}} error={{.State.Error}} finished_at={{.State.FinishedAt}}' "$container_name" || true
                docker logs --timestamps --tail 200 "$container_name" || true
                return 1
              fi
              if curl --silent --show-error --fail "$base_url/health" >/tmp/dezzta-health.json 2>/tmp/dezzta-health-error.txt; then
                ready=1
                break
              fi
              sleep 1
            done
            if [ "$ready" -ne 1 ]; then
              echo "Backend container remained running but /health did not become ready."
              cat /tmp/dezzta-health-error.txt || true
              docker inspect --format 'state={{.State.Status}} exit_code={{.State.ExitCode}} error={{.State.Error}} health={{if .State.Health}}{{.State.Health.Status}}{{else}}not-configured{{end}}' "$container_name" || true
              echo "Backend container startup logs:"
              docker logs --timestamps --tail 200 "$container_name" || true
              echo "Backend container process and port diagnostics:"
              docker exec "$container_name" sh -c 'id; ps; (ss -lntp || netstat -lntp || true)' || true
              return 1
            fi
            grep -Fq '"status":"ok"' /tmp/dezzta-health.json
          }
          wait_for_redis
          start_container
          wait_for_health

          app_uid=$(docker exec "$container_name" sh -c 'awk "/^Uid:/{print $2}" /proc/1/status')
          app_gid=$(docker exec "$container_name" sh -c 'awk "/^Gid:/{print $2}" /proc/1/status')
          volume_owner=$(docker exec "$container_name" stat -c '%u:%g' /data)
          database_owner=$(docker exec "$container_name" stat -c '%u:%g' /data/dezzta-chart-smoke.sqlite3)
          test "$app_uid" = "10001"
          test "$app_gid" = "10001"
          test "$volume_owner" = "10001:10001"
          test "$database_owner" = "10001:10001"

          first_status=$(curl --silent --show-error --output /tmp/dezzta-first.json --write-out '%{http_code}' "$base_url/v1/market-data/status")
          test "$first_status" = "200"
          second_status=$(curl --silent --show-error --output /tmp/dezzta-second.json --write-out '%{http_code}' "$base_url/v1/market-data/status")
          test "$second_status" = "429"

          docker exec "$container_name" python -c 'import sqlite3; c=sqlite3.connect("/data/dezzta-chart-smoke.sqlite3"); assert c.execute("PRAGMA integrity_check").fetchone()[0] == "ok"; assert c.execute("SELECT 1 FROM sqlite_master WHERE type=\u0027table\u0027 LIMIT 1").fetchone()'
          docker stop "$container_name" >/dev/null
          docker rm "$container_name" >/dev/null
          start_container
          wait_for_health
          docker exec "$container_name" python -c 'import sqlite3; c=sqlite3.connect("/data/dezzta-chart-smoke.sqlite3"); assert c.execute("PRAGMA integrity_check").fetchone()[0] == "ok"; assert c.execute("SELECT 1 FROM sqlite_master WHERE type=\u0027table\u0027 LIMIT 1").fetchone()'
          echo "Container health, isolated Redis guard, non-root UID/GID, mounted-volume ownership, SQLite integrity and restart persistence, and HTTP rate-limit rejection passed."

      - name: Scan backend container image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: dezzta-chart-backend:ci
          format: table
          vuln-type: os,library
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: '1'
          version: v0.76.2
          timeout: 10m0s

      - name: Export current image vulnerability report
        if: always()
        continue-on-error: true
        run: |
          if command -v trivy >/dev/null 2>&1 && docker image inspect dezzta-chart-backend:ci >/dev/null 2>&1; then
            trivy image --format json --output trivy-current.json --severity HIGH,CRITICAL --pkg-types os,library dezzta-chart-backend:ci
          else
            echo "Current image or Trivy binary unavailable; JSON report not produced."
          fi

      - name: Upload container vulnerability reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: container-vulnerability-reports
          path: trivy-current.json
          if-no-files-found: warn
          retention-days: 14
