<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="850" viewBox="0 0 1200 850" role="img" aria-labelledby="title desc">
<title id="title">DEZZTA CHART — Six-stage project progress dashboard</title>
<desc id="desc">Project-process dashboard. Stage 1 is active at 75 percent provisional, with 30 of 40 criteria accepted and 10 external criteria open. Stages 2 through 6 are not officially opened and are not scored. Overall 20.9 percent is a historical checkpoint, not a freshly recalculated value.</desc>
