    .num{font:800 28px system-ui,sans-serif;fill:#f8fafc}.name{font:700 19px system-ui,sans-serif;fill:#f8fafc}
    .body{font:500 14px system-ui,sans-serif;fill:#cbd5e1}.small{font:600 12px system-ui,sans-serif;fill:#cbd5e1}
    .pill{font:700 11px system-ui,sans-serif;letter-spacing:.5px}
