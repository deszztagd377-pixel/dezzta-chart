<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820" role="img" aria-labelledby="title desc">
<title id="title">DEZZTA CHART — Stage 1 external Gate 10 dashboard</title>
<desc id="desc">Ten external Stage 1 acceptance criteria are open: Gate 8 host secret injection, Gate 20 Firebase authentication and revocation, Gate 25 Redis security and persistence, Gate 30 target restore drill, Gate 31 off-host encrypted backup and key custody, Gate 34 persistent volume recovery, Gate 35 HTTPS host readiness, Gate 36 authenticated WSS including Android Capacitor WebView, Gate 38 operational metrics and dashboard, and Gate 39 zero-cost alerting and incident process. Zero of ten external gates are formally closed. Stage 1 remains 75 percent provisional, 300 of 400 ticks. This is a project-process dashboard, not an APK feature.</desc>
